# This workflow validates pushes to main branch with end2end tests.
name: E2E Tests

on:
  push:
    branches:
      - main

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      ref:
        description: |
          ref: the branch, tag or SHA to checkout.
          If empty, the ref is inferred from the event that triggered the workflow.
        required: false
        default: ''
        type: string
      provider_from_repo:
        description: |
          provider_from_repo: if True, the provider will be fetched from the repository and ref specified by
          'provider_repo' and 'provider_ref'.
          If False, the provider from Terraform REgistry will be used.
        required: true
        default: false
        type: boolean
      provider_repo:
        description: |
          provider_repo: the repository to checkout for the provider.
        required: false
        default: 'aws-tf/terraform-provider-aws-parallelcluster'
        type: string
      provider_ref:
        description: |
          provider_ref: the branch, tag or SHA to checkout for the provider.
        required: false
        default: 'main'
        type: string
      publish_metric:
        description: |
          publish_metric: if True, the outcome of the tests is published as an alarmed CloudWatch metric.
        required: false
        default: false
        type: boolean

permissions:
  id-token: write
  contents: read

jobs:
  end-to-end-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        path:
          - ./
          - ./modules/clusters
          - ./modules/required_infra
          - ./modules/pcluster_api
          - ./examples/api
          - ./examples/clusters
          - ./examples/full
          - ./examples/infra
        terraform:
          - 1.5.7
          - 1.8.0
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: Setup Terraform ${{ matrix.terraform }}
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false
      - name: Checkout Provider Repository
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.provider_repo }}
          ref: ${{ inputs.provider_ref }}
          path: provider
        if:  ${{ inputs.provider_from_repo == true }}
        # Builds the provider from source, so this must satisfy the `go`
        # directive in the provider's go.mod.
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.27.4
          cache-dependency-path: provider/go.sum
        if: ${{ inputs.provider_from_repo == true }}
      - name: Install Provider
        run: |
          cd provider
          make install
        if:  ${{ inputs.provider_from_repo == true }}
      - name: Switch to local Provider
        run: bash tools/use-local-provider.sh
        if: ${{ inputs.provider_from_repo == true }}
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: us-east-1
          role-to-assume: ${{ secrets.ACTION_E2E_TESTS_ROLE }}
          role-session-name: GitHub_${{ github.event.repository.name }}_End2EndTests
      - name: Terraform Init
        run: cd ${{ matrix.path }} && terraform init -backend-config="bucket=${{ secrets.ACTION_E2E_TESTS_BUCKET }}"
        timeout-minutes: 5
      - name: Terraform Test
        run: cd ${{ matrix.path }} && terraform test
        timeout-minutes: 60

  # Publishes the outcome of the E2E tests as a CloudWatch metric, so that a
  # CloudWatch alarm can make failures visible.
  # Pushes to main always report; a manual run only does so on request.
  publish-metric:
    name: Publish E2E Outcome Metric
    needs: end-to-end-tests
    # A cancelled or skipped test run says nothing about the health of the branch: it must
    # publish no data point at all, so that the alarm keeps the state it already had.
    if: >-
      ${{ always()
      && (github.event_name == 'push' || inputs.publish_metric)
      && (needs.end-to-end-tests.result == 'success'
      || needs.end-to-end-tests.result == 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: us-east-1
          role-to-assume: ${{ secrets.ACTION_E2E_TESTS_ROLE }}
          role-session-name: GitHub_${{ github.event.repository.name }}_E2EMetrics
      - name: Publish E2E Outcome Metric
        env:
          METRIC_VALUE: ${{ needs.end-to-end-tests.result == 'failure' && 1 || 0 }}
          GH_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GH_REF_NAME: ${{ github.ref_name }}
        run: |
          aws cloudwatch put-metric-data \
            --region us-east-1 \
            --namespace ParallelCluster \
            --metric-name TerraformModuleE2ETestFailure \
            --unit Count \
            --value "${METRIC_VALUE}" \
            --dimensions "Organization=${GH_REPOSITORY_OWNER},Branch=${GH_REF_NAME}"
        timeout-minutes: 5
