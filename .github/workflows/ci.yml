# This workflow validates PRs with code checks.
name: Continuous Integration

on:
  - pull_request

permissions:
  contents: read

jobs:
  code-checks:
    name: Code Checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest version HashiCorp still supports, and the newest one. HashiCorp
        # supports the current minor and the one before it, so 1.16 goes end of life when
        # 1.18 is released: bump both entries then.
        # See: https://endoflife.date/terraform
        terraform:
          - 1.16.7
          - 1.17.2
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Setup Terraform ${{ matrix.terraform }}
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false

        # Verify formatting
      - name: Terraform Format
        run: terraform fmt -recursive -check -diff ./
